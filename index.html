<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virat Kohli Gallery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
        margin: 0;
        padding: 30px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 24px;
      }
      .card {
        background: #1f2937;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      .card img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        display: block;
      }
      .card h3 {
        margin: 0;
        padding: 14px 16px 8px;
      }
      .card p {
        margin: 0;
        padding: 0 16px 16px;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <h1>Virat Kohli Moments</h1>

    <div class="gallery">
      <div class="card">
        <img
          src="https://your-image-url-here.com/bgt-2018-virat-kohli.jpg"
          alt="Virat Kohli during BGT 2018"
        />
        <h3>BGT 2018</h3>
        <p>Virat Kohli in the Border-Gavaskar Trophy 2018 series.</p>
      </div>

      <div class="card">
        <img
          src="https://your-image-url-here.com/virat-kohli-ipl-win.jpg"
          alt="Virat Kohli celebrating an IPL win"
        />
        <h3>IPL Winning Moment</h3>
        <p>Virat Kohli celebrating a major IPL-winning moment.</p>
      </div>

      <div class="card">
        <img
          src="https://your-image-url-here.com/india-batting-2025.jpg"
          alt="Virat Kohli batting for India in 2025"
        />
        <h3>India Batting 2025</h3>
        <p>Virat Kohli batting for India in a 2025 campaign.</p>
      </div>
    </div>
  </body>
</html>
